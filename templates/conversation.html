<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatGPT Style Input</title>
  <link rel="stylesheet" type="text/css" href="/static/css/conversation.css">
</head>
<body>

  <form action="/perform_conversation_with_gpt" method="POST" class="input-container">
    <input type="text" name="question" placeholder="Ask anything..." required />
    <button type="submit">
      <!-- Send icon (you can change to mic or something else) -->
      <svg fill="black" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </form>

</body>
</html>
